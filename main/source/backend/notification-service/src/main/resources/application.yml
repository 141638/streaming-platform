server:
  port: ${SERVER_PORT:0}

spring:
  application:
    name: notification-service
  webflux:
    base-path: /api/notifications
  flyway:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:streaming-platform}
    user: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456a}
    schemas: notification
    locations: classpath:db/migration
  r2dbc:
    url: "r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:streaming-platform}?options=search_path%3Dnotification"
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456a}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19091}
    consumer:
      group-id: ${KAFKA_GROUP_NOTIFICATION:notification-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      auto-startup: ${KAFKA_LISTENER_ENABLED:true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:r3d1s-d3v-p4ss-2024}
      timeout: 2s
      connect-timeout: 2s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: "${streaming.service.instance-id}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

streaming:
  service:
    instance-id: "${random.uuid}"
  jwt:
    issuer: ${JWT_ISSUER:https://auth.streaming.local}
    hmac-secret: ${JWT_HMAC_SECRET:MNH6CwQ7H4xAf69hpn0sc2Rn+wxT/d+I9QWELikQqgM=}

# ── Notification service configuration ────────────────────────────────────
notification:
  outbox:
    poll-interval: ${NOTIFICATION_OUTBOX_POLL_INTERVAL:5000}
    batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:50}
    max-retries: ${NOTIFICATION_OUTBOX_MAX_RETRIES:3}
  fanout:
    poll-interval: ${NOTIFICATION_FANOUT_POLL_INTERVAL:5000}
    batch-size: ${NOTIFICATION_FANOUT_BATCH_SIZE:100}
    max-concurrency: ${NOTIFICATION_FANOUT_MAX_CONCURRENCY:4}
    max-retries: ${NOTIFICATION_FANOUT_MAX_RETRIES:3}
    processing-timeout-seconds: ${NOTIFICATION_FANOUT_PROCESSING_TIMEOUT:60}
  email:
    from: ${NOTIFICATION_EMAIL_FROM:noreply@streaming.local}

# ── Spring Mail (SMTP) ────────────────────────────────────────────────────
spring.mail:
  host: ${SMTP_HOST:localhost}
  port: ${SMTP_PORT:1025}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail.smtp.auth: ${SMTP_AUTH:false}
    mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
