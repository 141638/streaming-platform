<div class="page-container p-4">
  <h2 class="mt-0 mb-3 text-xl font-semibold">My Channel</h2>

  @if (loading()) {
    <p-progressSpinner />
  }

  @if (errorMessage()) {
    <p-message severity="error" [text]="errorMessage()" styleClass="w-full mb-3" />
  }

  @if (!loading() && streams().length === 0 && !errorMessage()) {
    <p class="text-color-secondary">No streams yet. Click "Go Live" to create one.</p>
  }

  @for (stream of streams(); track stream.id) {
    <p-card styleClass="mb-3">
      <pre class="text-sm" style="white-space: pre-wrap; word-break: break-all;">{{ stream | json }}</pre>
    </p-card>
  }
</div>
