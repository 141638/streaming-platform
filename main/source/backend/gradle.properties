## Versions aligned with Gradle build scripts / pluginManagement (settings.gradle.kts)
springBootVersion=3.3.6
dependencyManagementPluginVersion=1.1.7
springCloudVersion=2023.0.4

## GraalVM CE 21 JDK toolchain (compilation + JVM mode). Graal Native Image is not wired by default — Spring Cloud Eureka
## uses beans that currently break Boot AOT; use `./gradlew bootJar` / JVM on Graal until native hints/upgrades land.
org.gradle.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.auto-download=true
