<div class="page-container flex justify-content-center align-items-center">
  <p-card styleClass="stream-create-card">
    <div class="flex flex-column gap-3">
      <h2 class="mt-0 mb-2 text-xl font-semibold">Create Stream</h2>

      <p-message
        *ngIf="errorMessage()"
        severity="error"
        styleClass="w-full"
        [text]="errorMessage()"
      />

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
        <div class="flex flex-column gap-1">
          <label for="stream-create-title" class="text-sm font-semibold">
            Title <span class="text-color-error">*</span>
          </label>
          <input
            id="stream-create-title"
            pInputText
            formControlName="title"
            class="w-full"
            autocomplete="off"
          />
        </div>

        <div class="flex flex-column gap-1">
          <label for="stream-create-desc" class="text-sm font-semibold">
            Description
          </label>
          <textarea
            id="stream-create-desc"
            pInputText
            formControlName="description"
            class="w-full"
            rows="3"
            autocomplete="off"
          ></textarea>
        </div>

        <div class="flex gap-3">
          <div class="flex flex-column gap-1 flex-1">
            <label for="stream-create-cat" class="text-sm font-semibold">
              Category
            </label>
            <input
              id="stream-create-cat"
              pInputText
              formControlName="category"
              class="w-full"
              autocomplete="off"
            />
          </div>
          <div class="flex flex-column gap-1" style="width: 140px">
            <label for="stream-create-viewers" class="text-sm font-semibold">
              Max Viewers
            </label>
            <p-inputNumber
              id="stream-create-viewers"
              formControlName="maxViewers"
              class="w-full"
              [min]="0"
            />
          </div>
        </div>

        <div class="flex justify-content-end gap-2 mt-2">
          <p-button
            label="Cancel"
            severity="secondary"
            [outlined]="true"
            (onClick)="onCancel()"
          />
          <p-button
            label="Create Stream"
            type="submit"
            [loading]="loading()"
            [disabled]="form.invalid || loading()"
          />
        </div>
      </form>
    </div>
  </p-card>
</div>
