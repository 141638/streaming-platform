<div class="p-4 md:p-6">
  <div class="home-header flex flex-column md:flex-row md:align-items-center md:justify-content-between gap-3 mb-4">
    <div>
      <h1 class="text-2xl font-bold m-0">Dashboard</h1>
      <p class="text-sm text-color-secondary mt-1 mb-0">
        Welcome to Streaming Platform
      </p>
    </div>
    <p-button
      label="Sign out"
      icon="pi pi-sign-out"
      severity="secondary"
      (onClick)="logout()"
    />
  </div>

  <div class="grid">
    <div class="col-12 md:col-6 lg:col-4">
      <p-card header="Getting started">
        <p class="m-0 text-color-secondary text-sm">
          You are signed in. This page will show your streams and recommended
          content once the stream service is integrated.
        </p>
      </p-card>
    </div>
  </div>
</div>
