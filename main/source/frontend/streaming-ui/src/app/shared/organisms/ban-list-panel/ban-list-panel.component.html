<div class="ban-list-panel flex flex-column gap-3">
  <div class="flex align-items-center justify-content-between gap-2">
    <span class="ban-panel-title text-sm font-semibold">
      Banned users · {{ mod.activeBans().length }}
    </span>
    <button
      pButton
      type="button"
      class="p-button-text p-button-sm p-button-rounded"
      icon="pi pi-refresh"
      [disabled]="loading()"
      (click)="onRefresh()"
      ariaLabel="Refresh banned users"
    ></button>
  </div>

  @if (loading()) {
    <div class="flex justify-content-center py-5">
      <p-progressSpinner
        strokeWidth="4"
        styleClass="w-2rem h-2rem"
        ariaLabel="Loading banned users"
      />
    </div>
  } @else if (error()) {
    <p-message severity="error" styleClass="w-full text-sm">
      {{ error() }}
    </p-message>
  } @else if (mod.activeBans().length === 0) {
    <div class="ban-empty flex flex-column align-items-center gap-2 py-6">
      <span class="pi pi-verified text-4xl"></span>
      <span class="text-sm">No one is banned.</span>
    </div>
  } @else {
    <div class="flex flex-column gap-2">
      @for (b of mod.activeBans(); track b.id) {
        <app-ban-list-item
          [ban]="b"
          [nowMs]="mod.now()"
          (unban)="onUnban($event)"
        />
      }
    </div>
  }
</div>
