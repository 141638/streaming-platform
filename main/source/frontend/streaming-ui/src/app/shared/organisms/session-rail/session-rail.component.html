<app-rail title="Recent Streams" [loading]="loading()" emptyLabel="No streams yet">
  @for (session of sessions(); track session.id) {
    <a
      [routerLink]="['/watch', session.id]"
      class="session-rail-card flex-shrink-0 no-underline cursor-pointer surface-card border-round-lg border-1 surface-border overflow-hidden transition-duration-150 hover:shadow-3"
    >
      <!-- Thumbnail -->
      <div
        class="session-rail-thumb bg-cover bg-center bg-no-repeat surface-200"
        [style.backgroundImage]="'url(' + thumbnailUrl(session) + ')'"
      >
        <span
          class="session-rail-date absolute lowercase"
          [title]="tooltipDate(session.createdAt)"
          [pTooltip]="tooltipDate(session.createdAt)"
          tooltipPosition="top"
        >
          {{ shortDate(session.createdAt) }}
        </span>
      </div>

      <!-- Description -->
      <div class="rail-description flex gap-2 p-2">
        <div
          class="rail-category-thumb flex-shrink-0 border-round flex align-items-center justify-content-center font-bold"
          [style]="categoryThumbnailStyle(session.category)"
        >
          <span class="text-2xl" style="color: oklch(95% 0 0 / 80%)">
            {{ categoryInitial(session.category) }}
          </span>
        </div>

        <div class="flex-auto flex flex-column justify-content-between overflow-hidden">
          <div class="flex flex-column">
            <span class="text-sm font-medium white-space-nowrap overflow-hidden text-overflow-ellipsis">
              {{ session.title }}
            </span>
            <span class="text-xs white-space-nowrap overflow-hidden text-overflow-ellipsis" style="color: var(--color-text-muted)">
              {{ channelName(session) }}
            </span>
          </div>
          <span class="text-xs white-space-nowrap overflow-hidden text-overflow-ellipsis" style="color: var(--color-text-dim)">
            {{ session.category }}
          </span>
        </div>

        <div class="flex flex-column justify-content-between align-items-end flex-shrink-0">
          <button
            pButton
            type="button"
            icon="pi pi-ellipsis-v"
            class="p-button-text p-button-rounded rail-menu-dots"
            disabled
            pTooltip="More actions coming soon"
            tooltipPosition="left"
          ></button>
          <app-stream-status-badge [status]="session.status" />
        </div>
      </div>
    </a>
  }
</app-rail>
