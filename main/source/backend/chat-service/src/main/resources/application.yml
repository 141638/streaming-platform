server:
  port: ${SERVER_PORT:0}

spring:
  application:
    name: chat-service
  webflux:
    base-path: /api/chat
  flyway:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:streaming-platform}
    user: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456a}
    schemas: chat
    locations: classpath:db/migration
  r2dbc:
    url: "r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:streaming-platform}?options=search_path%3Dchat"
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456a}
    pool:
      # Connection liveness: validate a pooled connection before handing it out and
      # cap acquire wait. Without this, the pool can serve a connection a firewall/PG
      # silently dropped during the 30m default idle window, and the first query then
      # blocks on a dead socket for seconds (the "slow first request after idle").
      validation-query: "SELECT 1"
      max-acquire-time: 3s
      max-idle-time: 5m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:r3d1s-d3v-p4ss-2024}
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19091}
    consumer:
      group-id: chat-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Keep the consumer from auto-starting at boot to avoid connection-retry
      # noise when the Kafka cluster is down or misconfigured. Set to true in
      # the env file when Kafka consumption is needed for active development.
      auto-startup: ${KAFKA_LISTENER_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: "${streaming.service.instance-id}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    # Belt-and-suspenders for anyone who DOES enable the Kafka listener without a
    # broker: silence the connect-retry chatter while still surfacing real ERRORs.
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.clients.consumer.internals: ERROR

chat:
  cache:
    # Per-key TTL on each room's recent-message ZSET (set on every write).
    # Bounds max staleness after a Redis restart with persisted-but-stale data
    # (ADR-0003). Raise for low-traffic/production rooms; lower for fresher data.
    room-ttl: ${CHAT_CACHE_ROOM_TTL:1h}
  pbac:
    # Layer-1 PBAC (ent) enforcement. Ships dark (default false): ChatAuthorization
    # short-circuits to allow when disabled, so enforcement lands without gating any
    # request until auth-service emits chat ent templates compatible with the matcher.
    enabled: ${CHAT_PBAC_ENABLED:false}

streaming:
  service:
    instance-id: "${random.uuid}"
  jwt:
    issuer: ${JWT_ISSUER:https://auth.streaming.local}
    hmac-secret: ${JWT_HMAC_SECRET:MNH6CwQ7H4xAf69hpn0sc2Rn+wxT/d+I9QWELikQqgM=}
