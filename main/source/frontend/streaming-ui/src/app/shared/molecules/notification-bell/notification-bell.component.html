<!--
  Notification bell in the shell header.
  Wave 5.2: shows unread badge from REST endpoint, click triggers mock toasts.
  Future: click → toggle popup menu with notification history.
-->
<button
  pButton
  type="button"
  class="p-button-rounded p-button-text p-overlay-badge"
  icon="pi pi-bell"
  (click)="onBellClick()"
  aria-label="Notifications"
>
  @if (unreadCount() > 0) {
    <p-badge
      [value]="unreadCount() > 99 ? '99+' : unreadCount()"
      severity="danger"
      size="small"
    />
  }
</button>
