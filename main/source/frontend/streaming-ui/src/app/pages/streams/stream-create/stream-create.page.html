<div class="page-container flex justify-content-center align-items-center">
  <p-card styleClass="stream-create-card">
    <div class="flex flex-column gap-3">
      <h2 class="mt-0 mb-2 text-xl font-semibold">Create Stream</h2>

      @if(errorMessage()){
      <p-message severity="error" styleClass="w-full" [text]="errorMessage()" />
      }

      <form [formGroup]="form" class="flex flex-column gap-3">
        <!-- Title -->
        <div class="flex flex-column gap-1">
          <label for="stream-create-title" class="text-sm font-semibold">
            Title <span class="text-color-error">*</span>
          </label>
          <input
            id="stream-create-title"
            pInputText
            formControlName="title"
            class="w-full"
            autocomplete="off"
          />
        </div>

        <!-- Description -->
        <div class="flex flex-column gap-1">
          <label for="stream-create-desc" class="text-sm font-semibold">
            Description
          </label>
          <textarea
            id="stream-create-desc"
            pInputText
            formControlName="description"
            class="w-full"
            rows="3"
            autocomplete="off"
          ></textarea>
        </div>

        <!-- Category + Max Viewers -->
        <div class="flex gap-3">
          <div class="flex flex-column gap-1 flex-1">
            <label for="stream-create-cat" class="text-sm font-semibold">
              Category
            </label>
            <p-select
              id="stream-create-cat"
              formControlName="categoryId"
              class="w-full"
              [options]="categories()"
              optionLabel="name"
              optionValue="id"
              placeholder="Select a category"
              [showClear]="true"
            />
          </div>
          <div class="flex flex-column gap-1" style="width: 120px">
            <label for="stream-create-viewers" class="text-sm font-semibold">
              Max Viewers
            </label>
            <p-inputNumber
              id="stream-create-viewers"
              formControlName="maxViewers"
              class="w-full"
              inputStyleClass="w-full"
              [min]="0"
              [showButtons]="false"
            />
          </div>
        </div>

        <!-- Tags -->
        <div class="flex flex-column gap-1">
          <label for="stream-create-tags" class="text-sm font-semibold">
            Tags
          </label>
          <p-chips
            id="stream-create-tags"
            formControlName="tags"
            class="w-full"
            placeholder="Add tags (e.g. ranked, speedrun)"
            [allowDuplicate]="false"
            [max]="10"
          />
        </div>

        <!-- Chat archive settings -->
        <div class="flex flex-column gap-2">
          <label class="text-sm font-semibold">
            Chat Archive
          </label>
          <div class="flex align-items-center gap-2 flex-initial">
            <p-toggleButton
              formControlName="autoArchiveChat"
              [onLabel]="'Auto-archive'"
              [offLabel]="'Keep chat'"
              styleClass="w-9rem"
            />
            @if (form.get('autoArchiveChat')?.value) {
              <div class="flex align-items-center gap-2 flex-auto">
                <label for="stream-create-archive-delay flex-initial" class="text-sm">
                  Delay (min):
                </label>
                <p-inputNumber
                  id="stream-create-archive-delay"
                  formControlName="chatArchiveDelayMinutes"
                  [min]="1"
                  [max]="1440"
                  [showButtons]="false"
                  class="flex-auto"
                  inputStyleClass="w-full"
                />
              </div>
            }
          </div>
          <small class="text-color-secondary">
            Automatically archive chat after the stream ends. Delay controls how
            long chat stays active before archiving.
          </small>
        </div>

        <!-- Scheduled Time -->
        <div class="flex flex-column gap-1">
          <label for="stream-create-schedule" class="text-sm font-semibold">
            Scheduled Time
            <span class="text-sm text-color-secondary"
              >(optional — for upcoming streams)</span
            >
          </label>
          <p-datePicker
            id="stream-create-schedule"
            formControlName="scheduledAt"
            class="w-full"
            [showTime]="true"
            [minDate]="now"
            placeholder="Pick a date and time"
            [showClear]="true"
          />
        </div>

        <!-- Actions -->
        <div class="flex justify-content-end gap-2 mt-2">
          <p-button
            label="Cancel"
            severity="secondary"
            [outlined]="true"
            (onClick)="onCancel()"
          />
          <p-button
            label="Save as Draft"
            severity="secondary"
            (onClick)="onSaveDraft()"
            [loading]="loading()"
            [disabled]="form.get('title')?.invalid || loading()"
          />
          <p-button
            label="Schedule Stream"
            (onClick)="onSchedule()"
            [loading]="loading()"
            [disabled]="form.get('title')?.invalid || !scheduledAtIsFuture || loading()"
          />
        </div>
      </form>
    </div>
  </p-card>
</div>
