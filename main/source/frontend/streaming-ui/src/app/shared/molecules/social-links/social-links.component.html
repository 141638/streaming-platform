@if (links()?.length) {
  <div class="flex flex-wrap gap-2">
    @for (link of links(); track link.platform) {
      <a
        [href]="link.url"
        target="_blank"
        rel="noopener noreferrer"
        class="no-underline"
      >
        <button
          pButton
          type="button"
          [icon]="iconFor(link.platform)"
          [label]="labelFor(link.platform)"
          class="p-button-outlined p-button-sm"
          [pTooltip]="link.url"
          tooltipPosition="top"
        ></button>
      </a>
    }
  </div>
}
