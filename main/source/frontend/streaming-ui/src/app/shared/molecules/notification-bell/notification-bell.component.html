<!--
  Notification bell in the shell header.
  Badge shows unread count from REST endpoint.
  Click toggles the dropdown overlay with notification history.
-->
<span class="p-overlay-badge" style="position: relative">
  <button
    pButton
    type="button"
    class="p-button-rounded p-button-text"
    icon="pi pi-bell"
    (click)="dropdown.toggle($event)"
    aria-label="Notifications"
  ></button>
  @if (unreadCount() > 0) {
    <p-badge
      [value]="unreadCount() > 99 ? '99+' : unreadCount()"
      severity="danger"
      size="small"
    />
  }
</span>

<p-popover
  #dropdown
  appendTo="body"
  [showTransitionOptions]="'120ms ease-out'"
  [hideTransitionOptions]="'100ms ease-in'"
  [style]="{ width: '360px' }"
>
  <app-notification-dropdown (navigateAway)="dropdown.hide()" />
</p-popover>
