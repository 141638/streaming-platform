<div class="w-full max-w-28rem px-4">
  <div class="login-panel p-5">
    <!-- Brand -->
    <div class="flex align-items-center gap-2 mb-4">
      <span class="pi pi-play-circle text-3xl" style="color: var(--color-brand)"></span>
      <span class="text-lg font-semibold" style="color: var(--color-text-secondary); letter-spacing: -0.01em">
        Streaming Platform
      </span>
    </div>

    <!-- Back link -->
    <a
      routerLink="/login"
      class="flex align-items-center gap-1 no-underline mb-3 text-sm cursor-pointer"
      style="color: var(--color-brand-muted)"
    >
      <span class="pi pi-arrow-left text-xs"></span>
      Back to sign in
    </a>

    <h1 class="text-2xl font-bold mt-0 mb-1" style="color: var(--color-text-primary); letter-spacing: -0.02em">
      Forgot password
    </h1>
    <p class="text-sm mt-0 mb-4" style="color: var(--color-text-muted)">
      Enter your email and we'll send you a reset link
    </p>

    <!-- Error -->
    @if (errorText(); as errMsg) {
      <p-message severity="error" styleClass="w-full mb-3">
        {{ errMsg }}
      </p-message>
    }

    <!-- Success -->
    @if (submitted()) {
      <p-message severity="success" styleClass="w-full mb-3">
        If an account with that email exists, a reset link has been sent.
        Check your inbox.
      </p-message>
    }

    <!-- Form -->
    @if (!submitted()) {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="flex flex-column gap-3">
          <div class="flex flex-column gap-1">
            <label
              for="fp-email"
              class="text-xs font-medium uppercase"
              style="color: var(--color-text-tertiary); letter-spacing: 0.04em"
            >
              Email address
            </label>
            <input
              id="fp-email"
              pInputText
              type="email"
              formControlName="email"
              autocomplete="email"
              class="w-full login-input"
            />
          </div>

          <p-button
            type="submit"
            label="Send reset link"
            icon="pi pi-send"
            [loading]="loading()"
            [disabled]="form.invalid || loading()"
            styleClass="w-full login-submit"
          />
        </div>
      </form>
    }
  </div>
</div>
