<p-dialog
  [visible]="visible()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [style]="{ width: '30rem' }"
  header="Ban user"
  (onHide)="onCancel()"
>
  <div class="flex flex-column gap-4 pt-2">
    @if (hasTarget()) {
      <div class="ban-target flex align-items-center gap-3 p-3 border-round-lg">
        <img
          class="ban-target-avatar"
          [src]="targetAvatar()"
          [alt]="targetName() + ' avatar'"
        />
        <div class="flex flex-column gap-1 min-w-0">
          <span class="ban-target-name text-base font-semibold white-space-nowrap overflow-hidden text-overflow-ellipsis">
            {{ targetName() }}
          </span>
          <span class="ban-target-meta text-xs">
            This user will no longer be able to send messages here.
          </span>
        </div>
      </div>
    }

    <form [formGroup]="form" class="flex flex-column gap-4">
      <div class="flex flex-column gap-2">
        <label class="ban-field-label text-sm font-medium" for="ban-reason">
          Reason <span class="ban-field-hint">(optional)</span>
        </label>
        <textarea
          pTextarea
          id="ban-reason"
          class="w-full"
          formControlName="reason"
          rows="3"
          [maxlength]="reasonMaxLength"
          placeholder="Add context for other moderators…"
        ></textarea>
      </div>

      <div class="flex flex-column gap-2">
        <label class="ban-field-label text-sm font-medium" for="ban-duration">
          Duration
        </label>
        <p-select
          inputId="ban-duration"
          formControlName="duration"
          [options]="durationOptions"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
        />
      </div>
    </form>

    <div class="flex justify-content-end gap-2">
      <p-button
        type="button"
        label="Cancel"
        severity="secondary"
        [text]="true"
        (click)="onCancel()"
      />
      <p-button
        type="button"
        label="Ban"
        icon="pi pi-ban"
        severity="danger"
        (click)="onConfirm()"
      />
    </div>
  </div>
</p-dialog>
