<div class="ban-row flex flex-column gap-2 p-3 border-round-lg">
  <!-- Header: identity + reason now own the full width -->
  <div class="ban-header flex align-items-start gap-3">
    <img
      class="ban-avatar"
      [src]="avatarUrl()"
      [alt]="nameLabel() + ' avatar'"
      loading="lazy"
    />

    <div class="flex flex-column gap-1 flex-auto min-w-0">
      <span class="ban-identity text-sm font-semibold white-space-nowrap overflow-hidden text-overflow-ellipsis">
        {{ nameLabel() }}
      </span>
      <span class="ban-reason text-xs">
        {{ reasonText() }}
      </span>
      <span class="ban-meta text-xs white-space-nowrap overflow-hidden text-overflow-ellipsis">
        {{ bannedByLabel() }}
      </span>
    </div>
  </div>

  <!-- Separator: partial-width centered rule between the static and interactive halves -->
  <div class="ban-divider"></div>

  <!-- Footer: unban on the left, duration editor on the right -->
  <div class="ban-actions flex align-items-center justify-content-between gap-2">
    <button
      pButton
      type="button"
      class="p-button-sm ban-unban-btn"
      icon="pi pi-lock-open"
      label="Unban"
      severity="secondary"
      (click)="onUnban()"
    ></button>

    <div class="ban-duration-editor flex align-items-center gap-1 border-1 surface-border border-round p-1">
      <button
        pButton
        type="button"
        class="p-button-text p-button-sm p-button-rounded"
        icon="pi pi-chevron-down"
        [disabled]="!canStepDown()"
        ariaLabel="Shorten ban duration"
        (click)="onStepShorter()"
      ></button>
      @if (isDirty()) {
        <span
          class="ban-expires ban-expires-pending text-xs"
          [class.ban-expires-permanent]="pendingIsPermanent()"
        >
          {{ pendingDurationLabel() }}
        </span>
      } @else {
        <span
          class="ban-expires text-xs"
          [class.ban-expires-permanent]="isPermanent()"
        >
          {{ durationLabel() }}
        </span>
      }
      <button
        pButton
        type="button"
        class="p-button-text p-button-sm p-button-rounded"
        icon="pi pi-chevron-up"
        [disabled]="!canStepUp()"
        ariaLabel="Extend ban duration"
        (click)="onStepLonger()"
      ></button>
      @if (isDirty()) {
        <button
          pButton
          type="button"
          class="p-button-text p-button-sm p-button-rounded ban-apply-btn"
          icon="pi pi-check"
          ariaLabel="Apply duration change"
          (click)="onApply()"
        ></button>
      }
    </div>
  </div>
</div>
