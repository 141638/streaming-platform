listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    3;
        hls_window      60;
    }

    # DVR auto-records every session to MP4. Files live on a persistent Docker
    # volume so they survive container restarts. Only archived streams (user
    # clicks "Archive") are kept long-term; unarchived files are cleaned up
    # after 7 days by a background job. See Phase 2.5c blueprint.
    dvr {
        enabled         on;
        dvr_path        /data/dvr/[app]/[stream]/[timestamp].mp4;
        dvr_plan        session;
    }

    # SRS calls stream-service webhooks on publish/unpublish.
    # Gateway URL provides retry resilience (3 retries with backoff).
    http_hooks {
        enabled         on;
	on_publish    http://192.168.30.27:8080/api/streams/v1/webhooks/srs/on_publish;
        on_unpublish    http://192.168.30.27:8080/api/streams/v1/webhooks/srs/on_unpublish;
    }
}
