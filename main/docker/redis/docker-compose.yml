services:
  redis:
    image: redis:7-alpine
    container_name: streaming-redis
    hostname: streaming-redis
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - streaming_network

networks:
  streaming_network:
    driver: bridge
