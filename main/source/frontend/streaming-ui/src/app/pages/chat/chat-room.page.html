<div class="chat-room-page flex flex-column h-full">
  @if (roomKey()) {
    <app-chat-panel class="flex-auto block" [roomKey]="roomKey()!" />
    <app-chat-load-test class="flex-initial" [roomKey]="roomKey()!" />
  } @else {
    <div
      class="flex justify-content-center align-items-center h-full"
      style="color: var(--color-text-muted)"
    >
      <span class="text-sm">No room key provided.</span>
    </div>
  }
</div>
